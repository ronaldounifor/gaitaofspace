
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaita of Space - Personagens</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f4f4;
            color: #222;
        }

        h1, h2 {
            color: #333;
        }

        section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        input, textarea, button {
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
        }

        input, textarea {
            width: 100%;
        }

        textarea {
            min-height: 120px;
            font-family: monospace;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        button.delete {
            background: #dc2626;
        }

        pre {
            background: #eee;
            padding: 15px;
            overflow-x: auto;
            white-space: pre-wrap;
            border-radius: 5px;
        }

        #status {
            padding: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <h1>🚀 Gaita of Space</h1>
    <p>Gerenciamento de personagens</p>

    <div id="status"></div>

    <section>
        <h2>Todos os personagens</h2>
        <button onclick="listarPersonagens()">Atualizar lista</button>
        <pre id="lista">Clique em atualizar para carregar.</pre>
    </section>

    <section>
        <h2>Buscar personagem</h2>
        <input type="text" id="buscarId" placeholder="ID do personagem">
        <button onclick="buscarPersonagem()">Buscar</button>
        <pre id="resultadoBusca"></pre>
    </section>

    <section>
        <h2>Criar personagem</h2>
        <p>Informe os dados do personagem em formato JSON:</p>

        <textarea id="novoPersonagem">{
    "nome": "Novo personagem"
}</textarea>

        <button onclick="criarPersonagem()">Cadastrar</button>
    </section>

    <section>
        <h2>Excluir personagem</h2>
        <input type="text" id="excluirId" placeholder="ID do personagem">
        <button class="delete" onclick="excluirPersonagem()">
            Excluir
        </button>
    </section>

    <script>
        // API hospedada no mesmo domínio do frontend
        const API_URL = "/personagens";

        function mensagem(texto, erro = false) {
            const status = document.getElementById("status");
            status.textContent = texto;
            status.style.color = erro ? "red" : "green";
        }

        async function requisicao(url, options = {}) {
            const resposta = await fetch(url, options);

            if (!resposta.ok) {
                const erro = await resposta.text();
                throw new Error(
                    `HTTP ${resposta.status}: ${erro}`
                );
            }

            if (resposta.status === 204) {
                return null;
            }

            const texto = await resposta.text();

            return texto ? JSON.parse(texto) : null;
        }

        async function listarPersonagens() {
            try {
                const dados = await requisicao(API_URL);

                document.getElementById("lista").textContent =
                    JSON.stringify(dados, null, 2);

                mensagem("Lista carregada com sucesso!");
            } catch (erro) {
                mensagem(erro.message, true);
            }
        }

        async function buscarPersonagem() {
            const id = document.getElementById("buscarId").value.trim();

            if (!id) {
                mensagem("Informe um ID.", true);
                return;
            }

            try {
                const dados = await requisicao(
                    `${API_URL}/${encodeURIComponent(id)}`
                );

                document.getElementById("resultadoBusca").textContent =
                    JSON.stringify(dados, null, 2);

                mensagem("Personagem encontrado!");
            } catch (erro) {
                mensagem(erro.message, true);
            }
        }

        async function criarPersonagem() {
            try {
                const dados = JSON.parse(
                    document.getElementById("novoPersonagem").value
                );

                const resultado = await requisicao(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dados)
                });

                mensagem("Personagem cadastrado com sucesso!");

                document.getElementById("resultadoBusca").textContent =
                    JSON.stringify(resultado, null, 2);

                listarPersonagens();

            } catch (erro) {
                mensagem(erro.message, true);
            }
        }

        async function excluirPersonagem() {
            const id = document.getElementById("excluirId").value.trim();

            if (!id) {
                mensagem("Informe um ID.", true);
                return;
            }

            if (!confirm(`Deseja excluir o personagem ${id}?`)) {
                return;
            }

            try {
                await requisicao(
                    `${API_URL}/${encodeURIComponent(id)}`,
                    { method: "DELETE" }
                );

                mensagem("Personagem excluído com sucesso!");
                listarPersonagens();

            } catch (erro) {
                mensagem(erro.message, true);
            }
        }

        // Carrega a lista ao abrir a página
        listarPersonagens();
    </script>

</body>
</html>
